name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/bridge-go ./cmd/bridge
      - run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bridge-go-linux-amd64 ./cmd/bridge
          tar -czf bridge-go-linux-amd64.tar.gz bridge-go-linux-amd64
          sha256sum bridge-go-linux-amd64.tar.gz > bridge-go-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-go-linux-amd64
          path: |
            bridge-go-linux-amd64.tar.gz
            bridge-go-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --check ../scripts/verify-codex-visibility.mjs
      - run: node --check ../scripts/verify-claude-proxy.mjs

  macos-bundle:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build
      - name: Verify bundled executables
        run: |
          test -x "src-tauri/target/release/bundle/macos/Codex CPA Bridge.app/Contents/MacOS/codex-cpa-bridge-ui"
          test -x "src-tauri/target/release/bundle/macos/Codex CPA Bridge.app/Contents/MacOS/bridge-go"
      - name: Archive unsigned development app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Codex CPA Bridge.app" codex-cpa-bridge-macos-unsigned.zip
          unzip -t codex-cpa-bridge-macos-unsigned.zip >/dev/null
          shasum -a 256 codex-cpa-bridge-macos-unsigned.zip > codex-cpa-bridge-macos-unsigned.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: codex-cpa-bridge-macos-${{ runner.arch }}-unsigned
          path: |
            ui/codex-cpa-bridge-macos-unsigned.zip
            ui/codex-cpa-bridge-macos-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 14
