[profiles.official]
home = "~/.codex"
mode = "native"
managed = false
enforce_native_login = false

[profiles.cpa]
home = "~/.codex-cpa"
endpoint = "http://127.0.0.1:8317/v1"
model = "YOUR_CPA_MODEL"
provider_name = "cpa-local"
model_catalog_json = "~/.codex-cpa/model-catalogs/cpa.json"
env_key = "CPA_API_KEY"

[ssh.cpa]
host = "127.0.0.1"
port = 2222
user = "YOUR_USERNAME"
profile = "cpa"
identity_file = "~/.ssh/id_ed25519"

[runtime]
state_dir = "~/.codex-cpa-bridge"
codex_binary = "codex"
app_server_args = ["app-server"]
