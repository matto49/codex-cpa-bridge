[profiles.official]
home = "~/.codex"
mode = "native"
managed = false
enforce_native_login = true

[profiles.cpa]
home = "~/.codex-cpa"
endpoint = "http://127.0.0.1:8317/v1"
model = "gpt-5.6-sol"
provider_name = "cpa-local"
# Optional bridge-side client auth for CPA. This command must print a bearer token.
# Keep the token itself out of this file.
auth_command = "/home/wangyang.49/.local/bin/cliproxy-auth-token"

[ssh.cpa]
host = "127.0.0.1"
port = 2222
user = "bytedance"
profile = "cpa"
# Optional. Used only by bridge doctor/up validation, not by generated server config.
identity_file = "~/.ssh/id_ed25519_byted"

[runtime]
state_dir = "~/.codex-cpa-bridge"
codex_binary = "codex"
app_server_args = ["app-server"]
